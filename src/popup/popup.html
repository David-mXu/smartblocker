<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowGuard</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        font: 13px system-ui, sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      button {
        margin: 0 6px 8px 0;
        padding: 5px 10px;
        cursor: pointer;
      }
      #status {
        color: #666;
        margin-bottom: 6px;
        min-height: 1em;
      }
      pre {
        background: #f4f4f4;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 8px;
        max-height: 380px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>FlowGuard POC</h1>
    <div>
      <button id="test-pair">Test Pair</button>
      <button id="scan-history">Scan History</button>
      <button id="latency-log">Latency Log</button>
      <button id="open-options">Options</button>
    </div>
    <div id="status"></div>
    <pre id="out">First "Test Pair" click downloads the model (~27MB) — watch the background console for progress.</pre>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
