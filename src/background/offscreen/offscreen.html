<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No meta CSP: rely on the manifest's extension_pages CSP (script-src
         'self' 'wasm-unsafe-eval'). A tighter meta policy here (e.g.
         default-src 'none') would block fetching the bundled ORT .wasm asset
         from the chrome-extension:// origin and break model load. -->
    <title>SmartBlocker Offscreen Classifier</title>
  </head>
  <body>
    <!-- ES module bundle (load-bearing): a plain-script IIFE build makes ORT
         dynamic-import its wasm glue from the CDN, which the CSP blocks. -->
    <script type="module" src="offscreen.js"></script>
  </body>
</html>
