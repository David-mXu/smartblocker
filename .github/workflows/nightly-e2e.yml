name: Nightly E2E

on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

# CI (security.yml) excludes the Playwright extension e2es on purpose
# (flake farm: persistent Chromium profiles, per-runner browser download,
# ~35MB model download, MV3 service-worker wake races). This nightly lane
# is the deliberate counterweight — a red here means a human looks, not a
# local re-run reflex.
#
# Layout:
#   job `e2e`      — typecheck + build + the pure-Node unit battery + the
#                    full Playwright chain. Every suite command redirects
#                    to its own log and captures its own exit code; the
#                    step itself succeeds so later suites still run and the
#                    logs always upload.
#   job `summary`  — fails the workflow if the e2e job failed up front
#                    (build/unit) or if ANY suite exit code was non-zero.
#
# Conventions mirror security.yml: actions/checkout@v4, setup-node@v4 on
# node 24 (>= 22.6 required for Node type stripping), dtolnay/rust-toolchain
# + Swatinem/rust-cache for companion crates.
#
# Firefox lanes (e2e-firefox-*.mjs / verify-firefox-dnr.mjs, SB_FIREFOX=...)
# stay OUT: no Firefox binary is provisioned on these runners.
# The newer suites (dashboard, profiles, schedule-prefs, partner, reward) are
# IN since 2026-11-21 — all five passed a local run first, which is the
# admission rule for this chain. They use throwaway /tmp profiles, so they
# re-download the model each night by design.
#
# Warm-model cache: keyed ONLY on the pinned EMBED_MODEL_REVISION from
# src/shared/config.ts. Suites that mkdtemp a throwaway profile under
# /tmp/opencode (allowance, allowance-daemon, backup) re-download the
# model each run by design — their profile paths are not cacheable.

jobs:
  e2e:
    name: Unit battery + Playwright e2e chain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      failed: ${{ steps.chain.outputs.failed }}
      results: ${{ steps.chain.outputs.results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22.6 required for --experimental type stripping
          cache: npm

      # Needed early: e2e-allowance-daemon-test (3rd in the chain) builds
      # companion binaries via cargo itself, same as the last suite.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      - name: Install node dependencies
        run: npm ci

      # Cache keys must come from the SOURCE pin, never a hand-kept copy: a
      # model bump then invalidates every warm profile automatically.
      - name: Read pinned model revision
        id: model
        run: |
          rev=$(sed -n "s/.*EMBED_MODEL_REVISION = '\([0-9a-f]\{40\}\)'.*/\1/p" src/shared/config.ts | head -1)
          if [ -z "$rev" ]; then
            echo "could not read EMBED_MODEL_REVISION from src/shared/config.ts" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      # The eval gate runs in Node/transformers.js; without this it cold-fetches
      # the pinned model every night (the browser profiles don't cover it).
      - name: Ensure Node model cache dirs exist
        run: mkdir -p node_modules/@huggingface/transformers/.cache ~/.cache/huggingface

      - name: Restore Node HF model cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/@huggingface/transformers/.cache
            ~/.cache/huggingface
          key: hf-model-${{ steps.model.outputs.revision }}
          restore-keys: hf-model-

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Restore warm model profiles
        uses: actions/cache@v4
        with:
          # Only classifier suites are cached: their CacheStorage holds the
          # ~35MB model (see CLAUDE.md model-facts). Non-classifier profiles
          # (schedule-ux/security/notifications/usage) never hold a model and
          # are not worth serializing. .dev-profile-protection is recreated
          # per run.
          path: |
            .e2e-profile
            .e2e-profile-p1
            .e2e-profile-p2
          key: embedded-model-${{ steps.model.outputs.revision }}-v1
          # Bump the -v1 suffix to force one cold re-download if a cached
          # profile is ever suspected of masking a regression.

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension (chrome / edge target)
        run: npm run build:chrome

      # HARD GATE before anything else can fail: if this step fails the job
      # fails, and actions/cache's post-if:success() skips the save — so a run
      # that could not download/load the model can never poison the warm-cache
      # key with a model-less profile.
      - name: Warm model cache (hard gate)
        run: node scripts/warm-model-cache.mjs

      - name: Unit battery (pure Node)
        run: |
          set +e
          mkdir -p logs exitcodes
          status=0
          # Every pure harness, discovered from disk. The old hand-kept list
          # silently excluded 22 suites (partner pin, DNR rules, resume
          # enforcer, centroid cache, allowance, companion bridge…); a new
          # *-test.mjs now gates automatically.
          for t in scripts/*-test.mjs; do
            case "$(basename "$t")" in
              e2e-*|smoke-test.mjs) continue;; # browser suites run in the chain; smoke-test is legacy NLI report-only
            esac
            name="$(basename "$t" .mjs)"
            echo "::group::$name"
            node "$t" > "logs/$name.log" 2>&1
            code=$?
            echo "$code" > "exitcodes/$name.exit"
            if [ "$code" -ne 0 ]; then
              status=1
              echo "$name FAILED (exit $code) — see logs/$name.log"
            else
              echo "$name passed"
            fi
            echo "::endgroup::"
          done
          echo "::group::verify-dataset"
          node scripts/verify-dataset.mjs > logs/verify-dataset.log 2>&1
          vcode=$?
          echo "$vcode" > exitcodes/verify-dataset.exit
          [ "$vcode" -ne 0 ] && { status=1; echo "verify-dataset FAILED — see logs/verify-dataset.log"; }
          echo "::endgroup::"
          # THE regression gate: 15,874 shipped-config cases diffed against the
          # committed baseline. It was previously never run by any workflow.
          echo "::group::eval"
          node scripts/eval.mjs > logs/eval.log 2>&1
          ecode=$?
          echo "$ecode" > exitcodes/eval.exit
          [ "$ecode" -ne 0 ] && { status=1; echo "eval FAILED — see logs/eval.log"; }
          echo "::endgroup::"
          exit $status

      - name: Playwright e2e chain
        id: chain
        env:
          # The build above already produced dist/chrome; suites that honor
          # this skip their internal rebuild. allow suites rebuild
          # unconditionally and simply spend the extra minutes.
          SB_SKIP_BUILD: '1'
        run: |
          set +e
          mkdir -p logs exitcodes /tmp/opencode
          failed=0
          results=''
          run_suite () {
            name="$1"; shift
            echo "::group::$name"
            # Per-suite cap (20 min): one hung Playwright wait must not consume
            # the whole 300-minute job budget and starve later suites. Normal
            # suites run 1–10 minutes.
            timeout 1200 "$@" > "logs/$name.log" 2>&1
            code=$?
            echo "$code" > "exitcodes/$name.exit"
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              results="$results $name=FAIL($code)"
            else
              results="$results $name=ok"
            fi
            echo "$name : exit=$code"
            echo "::endgroup::"
          }
          run_suite e2e-test                   node scripts/e2e-test.mjs
          run_suite e2e-allowance-test         node scripts/e2e-allowance-test.mjs
          run_suite e2e-allowance-daemon-test  node scripts/e2e-allowance-daemon-test.mjs
          run_suite e2e-stale-allow-race       node scripts/e2e-stale-allow-race.mjs
          run_suite e2e-p2-dnr                  node scripts/e2e-p2-dnr.mjs
          run_suite e2e-p2-kdf-modelpin        node scripts/e2e-p2-kdf-modelpin.mjs
          run_suite e2e-serp-stability         node scripts/e2e-serp-stability.mjs
          run_suite e2e-protection-verification node scripts/e2e-protection-verification.mjs
          run_suite e2e-p1-privacy-failclosed  node scripts/e2e-p1-privacy-failclosed.mjs
          run_suite e2e-p1-overrides-sanitizer node scripts/e2e-p1-overrides-sanitizer.mjs
          run_suite e2e-schedule-ux            node scripts/e2e-schedule-ux.mjs
          run_suite e2e-notifications          node scripts/e2e-notifications.mjs
          run_suite e2e-usage-ui                node scripts/e2e-usage-ui.mjs
          run_suite e2e-security-blockscreen   node scripts/e2e-security-blockscreen.mjs
          run_suite e2e-backup                  node scripts/e2e-backup.mjs
          run_suite e2e-dashboard-test         node scripts/e2e-dashboard-test.mjs
          run_suite e2e-profiles               node scripts/e2e-profiles.mjs
          run_suite e2e-schedule-prefs         node scripts/e2e-schedule-prefs.mjs
          run_suite e2e-partner-test           node scripts/e2e-partner-test.mjs
          run_suite e2e-reward-test            node scripts/e2e-reward-test.mjs
          # Last on purpose: a cargo env problem must never mask an
          # extension failure above.
          run_suite e2e-companion-test         node scripts/e2e-companion-test.mjs
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "results=$results" >> "$GITHUB_OUTPUT"
          if [ "$failed" -ne 0 ]; then
            echo "$failed suite(s) failed — inspect the nightly-e2e-logs artifact."
          fi

      # Defense in depth for the p1/p2 profiles (the warm step above only
      # proves .e2e-profile): if a suite failed before its profile ever cached
      # the model, drop that profile so the post-job cache save cannot store a
      # model-less one under an "embedded-model-<rev>" key.
      - name: Drop cold profiles before the cache save
        if: always()
        run: |
          for p in .e2e-profile .e2e-profile-p1 .e2e-profile-p2; do
            [ -d "$p" ] || continue
            size=$(du -sm "$p/Default/Service Worker/CacheStorage" 2>/dev/null | cut -f1 || true)
            if [ "${size:-0}" -lt 5 ]; then
              echo "dropping cold profile: $p (CacheStorage ${size:-0}MB)"
              rm -rf "$p"
            else
              echo "keeping warm profile: $p (CacheStorage ${size}MB)"
            fi
          done

      - name: Upload suite logs and exit codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-logs
          path: |
            logs/
            exitcodes/
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Nightly verdict
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail the workflow if anything exited non-zero
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          SUITES_FAILED: ${{ needs.e2e.outputs.failed }}
          SUITE_RESULTS: ${{ needs.e2e.outputs.results }}
        run: |
          echo "e2e job result: $E2E_RESULT"
          echo "results: $SUITE_RESULTS"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "Nightly e2e FAILED before/at the chain (build, typecheck or unit battery)."
            exit 1
          fi
          if [ "${SUITES_FAILED:-1}" != "0" ]; then
            echo "Nightly e2e FAILED: $SUITES_FAILED suite(s) exited non-zero. See the nightly-e2e-logs artifact."
            exit 1
          fi
          echo "Nightly e2e green: every suite exited 0."
