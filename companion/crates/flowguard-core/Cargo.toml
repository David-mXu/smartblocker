[package]
name = "flowguard-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure data + enforcement core for the FlowGuard desktop companion"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
interprocess = "2.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.5"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
